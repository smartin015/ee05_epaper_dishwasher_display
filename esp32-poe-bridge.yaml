# -----------------------------------------------------------------------------
# ESPHome BLE Bridge for EE05 4-Color ePaper Status Display
# -----------------------------------------------------------------------------
# Target board:  ESP32-POE-ISO  (Olimex / LAN8720 Ethernet)
# Role:          BLE client that pushes state to the EE05 over BLE
# Network:       Wired Ethernet (PoE powered — no WiFi)
# -----------------------------------------------------------------------------
# Adjust the ethernet block if using a different ESP32-POE board:
#   LilyGO T-Internet-POE:  change clk_mode, power pin
#   WT32-ETH01:             change all pin assignments
#   wESP32:                 change clk_mode to GPIO0_OUT
# -----------------------------------------------------------------------------

substitutions:
  device_name:  "poe-btproxy1"
  friendly:     "BLE proxy and EE05 Bridge"
  ee05_mac:     "E0:72:A1:F9:D5:E0"    # ← set to your EE05's BLE MAC

esphome:
  name: "${device_name}"
  friendly_name: "${friendly}"
  min_version: 2025.11.0
  name_add_mac_suffix: true

esp32:
  board:   esp32-poe-iso
  variant: esp32
  framework:
    type: esp-idf

api:
logger:

button:
  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

# ── Ethernet ─────────────────────────────────────────────────────────────────
ethernet:
  type: LAN8720
  mdc_pin:    GPIO23
  mdio_pin:   GPIO18
  clk:   
    pin: GPIO17 # Olimex ESP32-POE-ISO provides 50 MHz on GPIO17
    mode: CLK_OUT
  phy_addr:   0
  power_pin:  
    number: GPIO12           # LAN8720 power; omit if board handles this
    ignore_strapping_warning: true

# ── OTA updates (over Ethernet, no USB needed after first flash) ──────────────
ota:
  platform: esphome
  password: !secret ota_password

# ── IP address exposed to Home Assistant ──────────────────────────────────────
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "${friendly} IP Address"
      icon: mdi:ip-network

# ── Bluetooth Proxy (for Home Assistant) + BLE tracker ───────────────────────
#   The bridge acts as a remote Bluetooth adapter for HA.  Any BLE device in
#   range (sensors, switches, thermometers) is forwarded to Home Assistant.
#   This coexists with the EE05 ble_client below — same radio, shared duty cycle.
bluetooth_proxy:
  active: true
  connection_slots: 5

esp32_ble:
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    interval: 2s # scan aggressively (every ~2 s) to catch EE05 wakes
    window:  2s 
    active: true
  on_ble_advertise:
    # Match EE05 by MAC and connect.  Both conditions are in a single
    # lambda because the 'mac_address' filter syntax varies across ESPHome
    # versions.
    - lambda: |-
        if (x.address_str() == "${ee05_mac}") {
          ESP_LOGI("ee05", "EE05 seen — connecting...");
          if (!id(ee05_display).connected())
            id(ee05_display).connect();
        }

ble_client:
  - mac_address:   "${ee05_mac}"
    id:             ee05_display
    auto_connect:   true
    on_connect:
      then:
        - logger.log: "EE05 BLE connected"
        # Push current state as soon as we connect
        - script.execute: ee05_push_state
    on_disconnect:
      then:
        - logger.log: "EE05 BLE disconnected"

# ── Display state selector ────────────────────────────────────────────────────
select:
  - platform: template
    name:       "${friendly} Display State"
    id:         ee05_state
    optimistic: true                      # reflects change instantly in HA UI
    restore_value: true                   # survives reboot
    options:
      - "clean"
      - "dirty"
      - "running"
    initial_option: "clean"
    set_action:
      - script.execute: ee05_push_state

# ── Push state script ─────────────────────────────────────────────────────────
script:
  - id: ee05_push_state
    mode: single                          # don't stack up concurrent pushes
    then:
      - lambda: |-
          ESP_LOGD("ee05", "Pushing state: %s",
                   id(ee05_state).current_option().c_str());
      - ble_client.ble_write:
          id: ee05_display
          service_uuid:        4fafc201-1fb5-459e-8fcc-c5c9c331914b
          characteristic_uuid: beb5483e-36e1-4688-b7f5-ea07361b26a8
          value: !lambda |-
            auto opt = id(ee05_state).current_option();
            return std::vector<uint8_t>(opt.begin(), opt.end());

# ── Recurring sync — catches EE05 when it wakes from deep sleep ─────────────
interval:
  - interval: 13s
    then:
      - script.execute: ee05_push_state

# ── Heartbeat — log when EE05 stays disconnected ─────────────────────────────
  - interval: 300s
    then:
      - if:
          condition:
            not:
              lambda: 'return id(ee05_display).connected();'
          then:
            - logger.log: "EE05 has not connected recently; continuing to scan"
